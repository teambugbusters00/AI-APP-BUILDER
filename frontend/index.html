<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI App Builder</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#101522;color:#eef}input,textarea,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border-radius:9px}button{background:#7c9cff;border:0}pre{white-space:pre-wrap;background:#202a3b;padding:14px}</style><h1>AI App Builder</h1><input id="api" value="https://ai-app-blueprint-api.onrender.com"><input id="name" placeholder="Project name"><input id="features" placeholder="Features, comma separated"><button onclick="go()">Generate blueprint</button><pre id="out"></pre><script>async function go(){let r=await fetch(api.value+'/blueprint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,features:features.value.split(',').map(x=>x.trim()).filter(Boolean)})});out.textContent=JSON.stringify(await r.json(),null,2)}</script></html>
